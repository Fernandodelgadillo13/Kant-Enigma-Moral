# Crea una vista previa (canal temporal de Firebase Hosting) en cada
# pull request y publica el enlace como comentario en el PR.
name: Vista previa en Firebase Hosting (pull request)

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  vista-previa:
    needs: pruebas
    # Los PR desde forks no tienen acceso a los secretos.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
